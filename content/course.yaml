# Kurs tuzilmasi: qism (part) → bo'lim (chapter) → mavzu (topic).
#
# - Raqamlar (1, 1.1, 1.2 …) tartibdan avtomatik qo'yiladi — yozish shart emas.
# - slug — mavzu fayli nomi: content/topics/<slug>.md va sayt manzili /topics/<slug>.
#   Bir marta qo'yilgandan keyin o'zgartirmang (o'quvchi havolalari buziladi).
# - Bo'limda bitta mavzu bo'lsa, `topics` o'rniga bo'limning o'ziga `slug` yoziladi.
# - Fayli hali yo'q mavzular saytda "Tez orada" deb ko'rinadi.

parts:
  - title: "Part 1"
    chapters:
      - title: "To'liq qidiruv"
        topics:
          - { slug: brute-force, title: "Brute force va Big-O" }
